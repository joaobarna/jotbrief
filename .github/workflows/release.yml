name: Release do instalador

# A cada alteração do app na main, gera o instalador do Windows e publica uma Release.
# A versão é a data/hora do commit em Brasília (YYYY.MM.DD.HH.mm), igual à do app e à do JB Ladder.
# Mudanças só no site (site/**, docs) não geram instalador: o site é publicado pela Cloudflare Pages.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "extension/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o histórico inteiro alimenta a lista de versões

      - uses: astral-sh/setup-uv@v6

      - name: Versão (data/hora do commit, Brasília)
        id: ver
        shell: pwsh
        run: |
          $v = (uv run python scripts/gerar_changelog.py --versao).Trim()
          "versao=$v" >> $env:GITHUB_OUTPUT
          (git log -1 --pretty=%s) | Out-File -Encoding utf8 notas.txt
          "Versão $v"

      - name: Dependências
        run: uv sync

      - name: Testes
        run: uv run pytest -q -m "not slow"

      - name: App (PyInstaller)
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.versao }}" packaging/installer.iss

      # Ponte da troca de nome: os apps antigos (JB - Jot Brief) procuram o instalador com o nome antigo. Publicamos uma
      # cópia idêntica com esse nome para eles conseguirem se atualizar para o SaidKeep. Pode sair depois que todos migrarem.
      - name: Cópia com o nome antigo (para os apps antigos acharem a atualização)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.versao }}"
          Copy-Item "dist/SaidKeep-Setup-$v.exe" "dist/JB-Jot-Brief-Setup-$v.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*-Setup-*.exe

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: SaidKeep ${{ steps.ver.outputs.versao }}
          body_path: notas.txt
          files: |
            dist/SaidKeep-Setup-*.exe
            dist/JB-Jot-Brief-Setup-*.exe
