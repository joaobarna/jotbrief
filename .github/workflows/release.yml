name: Release do instalador

# Ao publicar uma tag (ex.: v0.2.0) gera o instalador do Windows e o anexa à Release do GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Dependências
        run: uv sync

      - name: Testes
        run: uv run pytest -q -m "not slow"

      - name: App (PyInstaller)
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not $v -or $v -eq "main") { $v = "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/JB-Jot-Brief-Setup-*.exe

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JB-Jot-Brief-Setup-*.exe
          generate_release_notes: true
