[project]
name = "saidkeep"
version = "0.1.0"
description = "Transcrição local de reuniões (Meet/Teams/Zoom) com Whisper e ata via Claude"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyaudiowpatch>=0.2.12.7",
    "soxr>=0.5",
    "numpy>=1.26",
    "soundfile>=0.12",
    "faster-whisper>=1.1",
    "onnxruntime>=1.17",  # silero-vad roda via ONNX (sem PyTorch); o modelo vem em src/saidkeep/assets
    "anthropic>=1.0",
    "pydantic>=2.7",
    "PySide6>=6.7",
    "send2trash>=2.1.0",
    "sherpa-onnx>=1.13.8",
    "mcp>=2.2.0",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
diarize = ["pyannote.audio>=3.3"]

[project.scripts]
saidkeep = "saidkeep.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saidkeep", "src/jotbrief"]

[tool.pytest.ini_options]
markers = ["slow: testes lentos (baixam modelos)"]
